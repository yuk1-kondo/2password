[package]
name = "twopassword-core"
description = "Shared cryptographic and vault core for 2Password clients"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
data-encoding = "2"
hkdf = "0.12"
pbkdf2 = "0.12"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
hmac = "0.12"
sha1 = "0.10"
csv = "1"
ureq = "3"
