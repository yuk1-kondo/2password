[package]
name = "twopassword-cli"
edition.workspace = true
license.workspace = true

[[bin]]
name = "2pw"
path = "src/main.rs"

[dependencies]
twopassword-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
