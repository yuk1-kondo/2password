[package]
name = "twopassword-ffi"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
data-encoding = "2"
twopassword-core = { path = "../core" }
thiserror = "2"
uniffi = "0.29"
uuid = "1"
serde_json = "1"

[dev-dependencies]
uniffi = { version = "0.29", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
